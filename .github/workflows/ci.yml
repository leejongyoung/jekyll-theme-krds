name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-example:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Scan attachment files for viruses (first time only)
        uses: ./attachment-scan
        with:
          source: example/assets/files
          manifest: example/_data/attachment_scan.json
      - name: Generate document preview PDFs
        uses: ./document-previews
        with:
          source: example/assets/files
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: example
      - name: Build example site
        working-directory: example
        run: bundle exec jekyll build --strict_front_matter
      - name: Build gem
        run: gem build jekyll-theme-krds.gemspec
