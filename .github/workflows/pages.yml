name: pages
# Jekyll 4로 예제 사이트를 빌드하고 공식 GitHub Pages Actions로 배포한다.
on:
  push:
    branches: [main]
    paths:
      - "_layouts/**"
      - "_includes/**"
      - "_sass/**"
      - "assets/**"
      - "example/**"
      - "jekyll-theme-krds.gemspec"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: example
      - name: Build demo site
        working-directory: example
        run: bundle exec jekyll build --config _config.yml,_config.pages.yml --strict_front_matter -d ../_pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
