name: shared-drift

# 두 테마에서 같아야 하는 파일이 방치된 채 어긋났는지 주 1회 엄격하게 본다.
# PR·푸시의 shared-files 잡은 경고만 남긴다(한쪽 PR이 먼저 병합되면 일시적으로 달라지므로).
# 일주일이 지나도 어긋나 있으면 이 잡이 실패하고 저장소 소유자에게 알림이 간다.
on:
  schedule:
    - cron: "17 3 * * 1"   # 매주 월요일 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-files-strict:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Compare shared files with the sibling theme (fail on drift)
        run: python3 script/check-shared.py --strict
