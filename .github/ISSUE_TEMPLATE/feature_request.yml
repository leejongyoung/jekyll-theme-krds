name: 기능 제안
description: 새 레이아웃, 컴포넌트, 설정 등을 제안합니다
title: "[제안] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        이 테마는 KRDS 컴포넌트를 Jekyll로 묶는 것이 목적입니다. KRDS에 없는 디자인을 새로 만드는 제안은 범위 밖일 수 있습니다.
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 지금 무엇이 불편한가요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방법
      description: 원하는 동작이나 설정 예시(`_config.yml`, front matter, 메뉴 데이터)를 적어 주세요.
    validations:
      required: true
  - type: input
    id: krds
    attributes:
      label: 관련 KRDS 컴포넌트·패턴
      description: KRDS 누리집의 해당 컴포넌트 주소가 있으면 붙여 주세요.
      placeholder: https://www.krds.go.kr/html/site/component/...
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 다른 방법
      description: 지금 사용자 사이트에서 덮어쓰기(`_includes`·`_layouts`)로 해결할 수 있는지도 적어 주세요.
  - type: dropdown
    id: contribute
    attributes:
      label: 직접 구현할 수 있나요?
      options:
        - 네, PR을 보내겠습니다
        - 도움이 있으면 가능합니다
        - 아니요
    validations:
      required: true
