name: 접근성 문제
description: 키보드, 스크린리더, 대비, 확대, 고대비 모드 등에서 이용에 장벽이 있습니다
title: "[접근성] "
labels: ["accessibility", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        이 테마는 접근성 인증을 받지 않았고, 확인하지 못한 환경이 있습니다([README](../blob/main/README.md#접근성과-검증)).
        어떤 장벽이 있는지 구체적으로 알려 주시면 큰 도움이 됩니다.
  - type: textarea
    id: barrier
    attributes:
      label: 어떤 장벽이 있나요?
      description: 무엇을 하려는데 무엇이 막혔는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: 어디서 발생하나요?
      description: 페이지 주소나 요소(메뉴, 사이드 내비게이션, 목차, 페이지네이션 등)를 적어 주세요.
    validations:
      required: true
  - type: dropdown
    id: tech
    attributes:
      label: 사용한 보조기술·방법
      multiple: true
      options:
        - 키보드만 사용
        - 스크린리더
        - 화면 확대 / 글자 크기 키우기
        - 고대비 모드 (테마의 선명하게 모드)
        - 운영체제 고대비·색 반전
        - 음성 제어
        - 모션 줄이기 설정
        - 기타
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 환경
      description: 스크린리더 이름·버전, 브라우저, OS
      placeholder: "예: VoiceOver, Safari 18, macOS 15"
  - type: input
    id: wcag
    attributes:
      label: 관련 기준 (알고 있다면)
      placeholder: "예: WCAG 2.1 1.4.3 대비(최소), KWCAG 2.2"
  - type: textarea
    id: expected
    attributes:
      label: 기대하는 동작
  - type: input
    id: version
    attributes:
      label: 테마 버전 또는 커밋
    validations:
      required: true
