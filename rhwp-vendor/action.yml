name: KRDS rhwp vendor
description: Download the rhwp library (MIT) into the site so the optional high-fidelity Hangul preview can load it. Checks a pinned SHA-256 first.
inputs:
  dest:
    description: Folder to put rhwp in, relative to GITHUB_WORKSPACE. Hugo static/assets/vendor/rhwp, Jekyll assets/vendor/rhwp.
    required: true
runs:
  using: composite
  steps:
    - name: Download and verify rhwp
      shell: bash
      env:
        RHWP_DEST: ${{ inputs.dest }}
      run: bash "${{ github.action_path }}/fetch.sh" "${GITHUB_WORKSPACE}/${RHWP_DEST}"
